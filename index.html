<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажёр тестов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column like an exam sheet; ballpoint ink for the work, a teacher's red pen for mistakes. */
:root {
  --paper: #F3F5F9;
  --sheet: #FFFFFF;
  --ink: #15213A;
  --muted: #5A6880;
  --line: #DAE0EA;
  --pen: #2445C7;
  --pen-soft: #E6EBFB;
  --ok: #17734A;
  --ok-soft: #E3F3EA;
  --red: #C62F27;
  --red-soft: #FBE8E6;
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E131B; --sheet: #161D28; --ink: #E7ECF4; --muted: #95A3B8; --line: #283245;
    --pen: #8EA2FF; --pen-soft: #1E2744; --ok: #4FC48C; --ok-soft: #12291F; --red: #FF7D72; --red-soft: #33191A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E131B; --sheet: #161D28; --ink: #E7ECF4; --muted: #95A3B8; --line: #283245;
  --pen: #8EA2FF; --pen-soft: #1E2744; --ok: #4FC48C; --ok-soft: #12291F; --red: #FF7D72; --red-soft: #33191A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font: 16px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 640px; margin: 0 auto; padding-block: 20px 48px; display: flex; flex-direction: column; gap: 18px; }
h1, h2 { font-family: var(--f-display); font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(26px, 7vw, 36px); line-height: 1.1; }
h2 { font-size: 18px; line-height: 1.25; }
p { margin: 0; }
.eyebrow { font: 500 12px/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }
.btn { min-height: 48px; padding: 12px 18px; border-radius: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn-main { background: var(--pen); color: var(--sheet); }
.btn-red { background: var(--red); color: var(--sheet); }
.btn-line { border: 1.5px solid var(--line); background: var(--sheet); }
.btn-wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.chip { min-height: 40px; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--sheet); font-weight: 500; font-size: 15px; }
.chip[aria-pressed="true"] { border-color: var(--pen); background: var(--pen-soft); color: var(--pen); }
.label { font-size: 14px; font-weight: 600; color: var(--muted); }

/* home */
.hero { display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }
.hero p { color: var(--muted); max-width: 46ch; }
.mode-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.last { font: 500 13px/1.3 var(--f-mono); color: var(--muted); }

/* quiz */
.qbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-block: 10px; display: flex; flex-direction: column; gap: 10px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.counter { font: 500 15px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.track { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.track > i { display: block; height: 100%; background: var(--pen); border-radius: 99px; transition: width .25s ease; }
.qtext { font-size: 19px; line-height: 1.45; font-weight: 500; }
.tag { font: 500 12px/1 var(--f-mono); letter-spacing: .04em; color: var(--muted); }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; text-align: left; padding: 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--sheet); min-height: 56px; }
.opt .let { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 600 15px/1 var(--f-mono); border: 1.5px solid var(--line); color: var(--muted); }
.opt span:last-child { padding-top: 5px; min-width: 0; }
.opt[aria-checked="true"] { border-color: var(--pen); background: var(--pen-soft); }
.opt[aria-checked="true"] .let { background: var(--pen); border-color: var(--pen); color: var(--sheet); }
.opts.tf { flex-direction: row; }
.opts.tf .opt { flex: 1; grid-template-columns: 1fr; justify-items: center; font-weight: 600; font-size: 18px; }
.opts.tf .opt .let { display: none; }
.opts.tf .opt span:last-child { padding-top: 2px; }
.qnav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.exit-warn { color: var(--red); font-weight: 600; }

/* results */
.grade-wrap { display: flex; gap: 20px; align-items: center; }
.grade { flex: none; width: 96px; height: 96px; display: grid; place-items: center; font: 700 52px/1 var(--f-display); color: var(--red); border: 3px solid var(--red); border-radius: 50% 46% 52% 44% / 48% 54% 46% 52%; transform: rotate(-6deg); }
.score { font: 700 30px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.topics { display: flex; flex-direction: column; gap: 8px; }
.trow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; }
.trow .track { grid-column: 1 / -1; height: 5px; }
.trow .track > i { background: var(--ok); }
.trow b { font: 500 13px/1.4 var(--f-mono); font-variant-numeric: tabular-nums; }

/* review */
.err { border-left: 3px solid var(--red); }
.err-head { display: flex; justify-content: space-between; gap: 10px; }
.mark { font: 600 12px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--red); }
.ans { display: grid; gap: 8px; }
.ans div { border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.ans .yours { background: var(--red-soft); }
.ans .yours s { text-decoration-color: var(--red); text-decoration-thickness: 2px; }
.ans .right { background: var(--ok-soft); }
.ans small { display: block; font: 600 11px/1.4 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; }
.ans .yours small { color: var(--red); }
.ans .right small { color: var(--ok); }
.note { font-style: italic; color: var(--red); font-size: 15px; padding-left: 12px; border-left: 2px dotted var(--red); }
.all-good { text-align: center; padding: 28px 18px; }

/* study */
.memo ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.memo li::marker { font-family: var(--f-mono); color: var(--pen); font-weight: 600; }
.memo b { color: var(--pen); }
.search { width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink); font: inherit; }
.chips-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips-scroll .chip { flex: none; }
.card { gap: 10px; }
.card .ansbox { background: var(--ok-soft); border-radius: 10px; padding: 10px 12px; font-weight: 600; color: var(--ok); }
.card .ansbox.hidden-ans { background: var(--pen-soft); color: var(--pen); font-weight: 500; text-align: center; cursor: pointer; }
.card .note { color: var(--muted); border-left-color: var(--muted); }
.switch { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500; cursor: pointer; }
.switch input { width: 22px; height: 22px; accent-color: var(--pen); }
.empty { text-align: center; color: var(--muted); padding: 24px; }
/* subjects, modes, feedback */
.subj { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; text-align: left; padding: 18px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--sheet); }
.subj h2 { font-size: 20px; }
.subj .meta { grid-column: 1; color: var(--muted); font-size: 14px; }
.subj .go { grid-row: 1 / 3; grid-column: 2; font: 600 22px/1 var(--f-mono); color: var(--pen); }
.subj .track { grid-column: 1 / -1; margin-top: 8px; height: 5px; }
.subj .track > i { background: var(--ok); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; background: var(--paper); border-radius: 14px; border: 1px solid var(--line); }
.seg button { padding: 10px 8px; border-radius: 10px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.seg button b { font-size: 16px; }
.seg button small { font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.seg button[aria-pressed="true"] { background: var(--sheet); box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
.seg button[aria-pressed="true"] b { color: var(--pen); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font: 700 22px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); line-height: 1.3; }
.stat.red b { color: var(--red); }
.stat.ok b { color: var(--ok); }
.weak .trow .track > i { background: var(--red); }
.weak .trow.good .track > i { background: var(--ok); }
.opt.is-right { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-right .let { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.opt.is-wrong { border-color: var(--red); background: var(--red-soft); }
.opt.is-wrong .let { background: var(--red); border-color: var(--red); color: var(--sheet); }
.opt.is-dim { opacity: .55; }
.opts.locked .opt { cursor: default; }
.fb { border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.fb.ok { background: var(--ok-soft); }
.fb.bad { background: var(--red-soft); }
.fb strong { font-family: var(--f-display); font-size: 16px; }
.fb.ok strong { color: var(--ok); }
.fb.bad strong { color: var(--red); }
.fb .note { margin-top: 2px; }
.live { font: 500 13px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.live .r { color: var(--ok); } .live .w { color: var(--red); }
.back { min-height: 40px; padding: 8px 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<!-- Тесты: каждый файл test-*.js добавляет один тест -->
<script src="test-medstat.js"></script>

<script>
/* ---------- данные ---------- */
const SETS = (window.TESTS || []).filter(t => t && t.questions && t.questions.length);
const ALL = [];
const SUBJ = [];
SETS.forEach(s => {
  const name = s.subject || "Без предмета";
  let sub = SUBJ.find(x => x.name === name);
  if (!sub) { sub = { name, sets: [], qs: [] }; SUBJ.push(sub); }
  sub.sets.push(s);
  s.questions.forEach(q => { const x = Object.assign({}, q, { key: s.id + ":" + q.id, set: s.id, part: s.short || s.title, subject: name }); sub.qs.push(x); ALL.push(x); });
});
const byKey = Object.fromEntries(ALL.map(q => [q.key, q]));
const LET = ["А","Б","В","Г","Д","Е"];
const KEY = "trainer.v2";

/* ---------- память ---------- */
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
let db = Object.assign({ stats: {}, last: {}, mode: "prep" }, load());
try { // перенос ошибок из прошлой версии
  const old = JSON.parse(localStorage.getItem("tests.v1"));
  if (old && old.sets && !db.migrated) {
    Object.entries(old.sets).forEach(([sid, st]) => (st.wrong || []).forEach(id => { db.stats[sid + ":" + id] = { s: 1, r: 0, w: 1, b: 1, l: 0 }; }));
    db.migrated = 1;
  }
} catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){} }
const st = key => db.stats[key] || { s: 0, r: 0, w: 0, b: 0, l: null };
function record(q, ok){
  const s = Object.assign({}, st(q.key));
  s.s++; if (ok) { s.r++; s.b = s.b >= 1 ? s.b + 1 : 2; s.l = 1; } else { s.w++; s.b = 1; s.l = 0; }
  db.stats[q.key] = s;
}
const isWrong = q => st(q.key).l === 0;
const isMastered = q => st(q.key).b >= 3;

function topicStats(qs){
  const m = {};
  qs.forEach(q => { const t = q.t || "Без темы"; const s = st(q.key); m[t] = m[t] || { t, r: 0, w: 0, n: 0 }; m[t].n++; m[t].r += s.r; m[t].w += s.w; });
  return Object.values(m).map(x => Object.assign(x, { tries: x.r + x.w, acc: x.r + x.w ? x.r / (x.r + x.w) : null }));
}
/* умный подбор: чаще ошибочные вопросы и слабые темы */
function weightOf(q, topicErr){
  const s = st(q.key);
  let w = !s.s ? 3 : s.l === 0 ? 40 : [3, 6, 3, 1, 0.5, 0.25][Math.min(s.b, 5)];
  return w * (1 + 3 * (topicErr[q.t || "Без темы"] || 0));
}
function smartPick(pool, k){
  const te = {}; topicStats(pool).forEach(x => { te[x.t] = x.tries >= 3 ? 1 - x.acc : 0; });
  return shuffle(pool.map(q => ({ q, k: Math.pow(Math.random(), 1 / weightOf(q, te)) })).sort((a, b) => b.k - a.k).slice(0, k).map(x => x.q));
}

/* ---------- утилиты ---------- */
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const app = document.getElementById("app");
const top0 = () => window.scrollTo(0, 0);
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
function plural(n, a, b, c){ const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; }
function gradeOf(p){ return p >= 0.9 ? 5 : p >= 0.75 ? 4 : p >= 0.6 ? 3 : 2; }

let SUB = null;          // выбранный предмет
let ui = { count: 20, topic: "all", part: "all" };
let test = null;
let study = { topic: "all", part: "all", q: "", hide: false, onlyWrong: false, open: new Set() };

function topicsOf(qs){ return [...new Set(qs.map(q => q.t).filter(Boolean))]; }
function poolOf(){
  let p = SUB.qs;
  if (ui.part !== "all") p = p.filter(q => q.set === ui.part);
  if (ui.topic !== "all") p = p.filter(q => q.t === ui.topic);
  return p;
}

/* ---------- 1. выбор предмета ---------- */
function subjects(){
  SUB = null; test = null;
  app.innerHTML = `
    <header class="hero">
      <span class="eyebrow">Тренажёр тестов</span>
      <h1>Выберите предмет</h1>
      <p>Тесты берутся только из выбранного предмета. Программа запоминает ваши ошибки и чаще даёт трудные вопросы.</p>
    </header>
    ${SUBJ.map((s, i) => {
      const m = s.qs.filter(isMastered).length;
      return `<button class="subj" data-s="${i}"><h2>${esc(s.name)}</h2><span class="go">→</span>
        <span class="meta">${s.qs.length} ${plural(s.qs.length, "вопрос", "вопроса", "вопросов")} · освоено ${m}</span>
        <div class="track" aria-hidden="true"><i style="width:${pct(m, s.qs.length)}%"></i></div></button>`;
    }).join("")}`;
  app.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { SUB = SUBJ[+b.dataset.s]; ui.topic = "all"; ui.part = "all"; study = { topic: "all", part: "all", q: "", hide: study.hide, onlyWrong: false, open: new Set() }; subjectHome(); });
  top0();
}

/* ---------- 2. экран предмета ---------- */
function subjectHome(){
  test = null;
  const qs = SUB.qs, total = qs.length;
  const mastered = qs.filter(isMastered).length, wrongN = qs.filter(isWrong).length, seen = qs.filter(q => st(q.key).s).length;
  const ts = topicStats(qs).filter(x => x.tries).sort((a, b) => a.acc - b.acc);
  const pool = poolOf();
  const counts = [...new Set([20, 50].filter(c => c < pool.length).concat(pool.length))];
  if (!counts.includes(ui.count)) ui.count = counts[0];
  const prep = db.mode === "prep";
  const last = db.last[SUB.name];
  app.innerHTML = `
    <div class="row between"><button class="btn btn-line back" id="toSubj">← Предметы</button>${last ? `<span class="last">прошлый: ${last.ok}/${last.total}</span>` : ""}</div>
    <header class="hero" style="padding-top:0"><span class="eyebrow">Предмет</span><h1>${esc(SUB.name)}</h1></header>

    <section class="sheet">
      <div class="stats">
        <div class="stat ok"><b>${mastered}</b><span>освоено из ${total}</span></div>
        <div class="stat red"><b>${wrongN}</b><span>сейчас с ошибкой</span></div>
        <div class="stat"><b>${total - seen}</b><span>ещё не решали</span></div>
      </div>
      ${ts.length ? `<div class="topics weak"><div class="label">Темы: сначала самые слабые</div>
        ${ts.map(x => `<div class="trow ${x.acc >= 0.8 ? "good" : ""}"><span>${esc(x.t)}</span><b>${pct(x.r, x.tries)}%</b><div class="track"><i style="width:${Math.max(4, pct(x.r, x.tries))}%"></i></div></div>`).join("")}</div>`
        : `<p class="muted" style="font-size:15px">После первого теста здесь появятся ваши слабые темы.</p>`}
    </section>

    <section class="sheet">
      <div class="seg" role="group" aria-label="Режим">
        <button data-mode="prep" aria-pressed="${prep}"><b>Подготовка</b><small>ответ сразу после вопроса</small></button>
        <button data-mode="exam" aria-pressed="${!prep}"><b>Экзамен</b><small>ответы только в конце</small></button>
      </div>
      <p class="muted" style="font-size:14px">${prep ? "Чаще попадаются вопросы, где вы ошибались, и слабые темы." : "Вопросы выбираются случайно, как на настоящем экзамене."}</p>
      ${SUB.sets.length > 1 ? `<div><div class="label">Тест</div><div class="row" style="margin-top:8px">
        <button class="chip" data-part="all" aria-pressed="${ui.part==="all"}">Все</button>
        ${SUB.sets.map(s => `<button class="chip" data-part="${esc(s.id)}" aria-pressed="${ui.part===s.id}">${esc(s.short || s.title)}</button>`).join("")}</div></div>` : ""}
      <div><div class="label">Тема</div><div class="row" style="margin-top:8px">
        <button class="chip" data-topic="all" aria-pressed="${ui.topic==="all"}">Все темы</button>
        ${topicsOf(SUB.qs.filter(q => ui.part === "all" || q.set === ui.part)).map(t => `<button class="chip" data-topic="${esc(t)}" aria-pressed="${ui.topic===t}">${esc(t)}</button>`).join("")}</div></div>
      <div><div class="label">Сколько вопросов</div><div class="row" style="margin-top:8px">
        ${counts.map(c => `<button class="chip" data-count="${c}" aria-pressed="${ui.count===c}">${c === pool.length ? `Все ${c}` : c}</button>`).join("")}</div></div>
      <button class="btn btn-main btn-wide" id="go">${prep ? "Начать подготовку" : "Начать экзамен"}</button>
      ${wrongN ? `<button class="btn btn-line btn-wide" id="goWrong" style="color:var(--red);border-color:var(--red)">Решить только мои ошибки · ${wrongN}</button>` : ""}
    </section>

    <section class="sheet">
      <h2>Учить</h2>
      <p class="muted">Вопрос и сразу правильный ответ. Можно скрыть ответы и проверять себя.</p>
      <button class="btn btn-line btn-wide" id="goStudy">Открыть: вопрос → ответ</button>
    </section>`;
  app.querySelector("#toSubj").onclick = subjects;
  app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { db.mode = b.dataset.mode; save(); subjectHome(); });
  app.querySelectorAll("[data-part]").forEach(b => b.onclick = () => { ui.part = b.dataset.part; ui.topic = "all"; subjectHome(); });
  app.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => { ui.topic = b.dataset.topic; subjectHome(); });
  app.querySelectorAll("[data-count]").forEach(b => b.onclick = () => { ui.count = +b.dataset.count; subjectHome(); });
  app.querySelector("#go").onclick = () => { const p = poolOf(); startTest(db.mode === "prep" ? smartPick(p, ui.count) : shuffle(p).slice(0, ui.count), db.mode); };
  const gw = app.querySelector("#goWrong"); if (gw) gw.onclick = () => startTest(shuffle(SUB.qs.filter(isWrong)), db.mode);
  app.querySelector("#goStudy").onclick = () => { study.open = new Set(); studyView(); };
  top0();
}

/* ---------- 3. тест ---------- */
function startTest(list, mode){
  if (!list.length) return subjectHome();
  test = { mode, i: 0, exitArmed: false, items: list.map(q => ({ q, order: q.tf ? [0,1] : shuffle(q.o.map((_, i) => i)), pick: null, checked: false })) };
  quiz(); top0();
}
function quiz(){
  const { items, i, mode } = test, it = items[i], q = it.q, n = items.length, last = i === n - 1;
  const prep = mode === "prep";
  const done = items.filter(x => prep ? x.checked : x.pick !== null).length;
  const r = items.filter(x => x.checked && x.pick === x.q.a).length, w = items.filter(x => x.checked && x.pick !== x.q.a).length;
  const locked = prep && it.checked;
  const optClass = oi => !locked ? "" : oi === q.a ? "is-right" : oi === it.pick ? "is-wrong" : "is-dim";
  app.innerHTML = `
    <div class="qbar">
      <div class="row between">
        <button class="btn btn-line back" id="exit">${test.exitArmed ? '<span class="exit-warn">Точно выйти?</span>' : "Выйти"}</button>
        ${prep ? `<span class="live"><span class="r">✓ ${r}</span> · <span class="w">✗ ${w}</span></span>` : `<span class="eyebrow">Экзамен</span>`}
        <span class="counter">${i+1} / ${n}</span>
      </div>
      <div class="track" aria-hidden="true"><i style="width:${done/n*100}%"></i></div>
    </div>
    <section class="sheet">
      <span class="tag">${q.tf ? "Верно или неверно?" : esc(q.t)}</span>
      <p class="qtext">${esc(q.q)}</p>
      <div class="opts ${q.tf ? "tf" : ""} ${locked ? "locked" : ""}" role="radiogroup">
        ${it.order.map((oi, k) => `<button class="opt ${optClass(oi)}" role="radio" data-oi="${oi}" aria-checked="${it.pick===oi}" ${locked ? "disabled" : ""}><span class="let">${LET[k]}</span><span>${esc(q.o[oi])}</span></button>`).join("")}
      </div>
      ${locked ? (it.pick === q.a
        ? `<div class="fb ok"><strong>Правильно</strong>${q.n ? `<p class="note" style="color:var(--ok);border-left-color:var(--ok)">${esc(q.n)}</p>` : ""}</div>`
        : `<div class="fb bad"><strong>Ошибка</strong><span>Правильный ответ: <b>${esc(q.o[q.a])}</b></span>${q.n ? `<p class="note">${esc(q.n)}</p>` : ""}</div>`) : ""}
    </section>
    <div class="qnav">
      ${prep ? `<button class="btn btn-line" id="prev" ${i===0?"disabled":""}>Назад</button>
                ${locked ? (last ? `<button class="btn btn-main" id="finish">Результат</button>` : `<button class="btn btn-main" id="next">Дальше</button>`)
                         : `<button class="btn btn-line" disabled>Выберите ответ</button>`}`
             : `<button class="btn btn-line" id="prev" ${i===0?"disabled":""}>Назад</button>
                ${last ? `<button class="btn btn-main" id="finish">Завершить${done<n ? ` (${done}/${n})` : ""}</button>` : `<button class="btn btn-line" id="next">Дальше</button>`}`}
    </div>`;
  app.querySelectorAll(".opt:not([disabled])").forEach(b => b.onclick = () => {
    it.pick = +b.dataset.oi; test.exitArmed = false;
    if (prep) { it.checked = true; test.justChecked = true; record(q, it.pick === q.a); save(); quiz(); return; }
    app.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-checked", x === b));
    if (!last) setTimeout(() => { if (test && test.items[test.i] === it) { test.i++; quiz(); } }, 260); else quiz();
  });
  app.querySelector("#exit").onclick = () => { if (test.exitArmed) { if (prep) finishCommon(true); subjectHome(); } else { test.exitArmed = true; quiz(); } };
  const pv = app.querySelector("#prev"); if (pv) pv.onclick = () => { test.i--; test.exitArmed = false; quiz(); };
  const nx = app.querySelector("#next"); if (nx) nx.onclick = () => { test.i++; test.exitArmed = false; quiz(); top0(); };
  const fin = app.querySelector("#finish"); if (fin) fin.onclick = finish;
  if (locked && test.justChecked) { test.justChecked = false; const nav = app.querySelector(".qnav"); if (nav && nav.scrollIntoView) nav.scrollIntoView({ block: "end", behavior: "smooth" }); }
}
function finishCommon(partial){
  const items = test.items;
  if (test.mode === "exam") items.forEach(x => record(x.q, x.pick === x.q.a));
  const counted = test.mode === "prep" ? items.filter(x => x.checked) : items;
  const ok = counted.filter(x => x.pick === x.q.a).length;
  if (counted.length) db.last[SUB.name] = { ok, total: counted.length };
  save();
  return { ok, counted };
}
function finish(){ const r = finishCommon(); test.done = r; results(); }
function results(){
  const { ok, counted } = test.done, n = counted.length, bad = n - ok, p = n ? ok / n : 0;
  const per = topicsOf(counted.map(x => x.q)).map(t => { const xs = counted.filter(x => x.q.t === t); return { t, n: xs.length, ok: xs.filter(x => x.pick === x.q.a).length }; });
  app.innerHTML = `
    <section class="sheet">
      <span class="eyebrow">${test.mode === "prep" ? "Подготовка" : "Экзамен"} · ${esc(SUB.name)}</span>
      <div class="grade-wrap">
        <div class="grade" aria-label="Оценка ${gradeOf(p)}">${gradeOf(p)}</div>
        <div><div class="score">${ok} из ${n}</div><p class="muted">${pct(ok, n)}% правильно${bad ? ` · ошибок: ${bad}` : ""}</p></div>
      </div>
      <div class="topics">${per.map(r => `<div class="trow"><span>${esc(r.t)}</span><b>${r.ok}/${r.n}</b><div class="track"><i style="width:${r.ok/r.n*100}%"></i></div></div>`).join("")}</div>
    </section>
    ${bad ? `<button class="btn btn-red btn-wide" id="review">Работа над ошибками · ${bad}</button>
             <button class="btn btn-line btn-wide" id="redo">Решить ошибки заново</button>`
          : `<div class="sheet all-good"><h2>Без единой ошибки</h2><p class="muted">Можно брать следующий набор.</p></div>`}
    <div class="qnav"><button class="btn btn-line" id="home">К предмету</button><button class="btn btn-main" id="again">Ещё тест</button></div>`;
  const rv = app.querySelector("#review"); if (rv) rv.onclick = review;
  const rd = app.querySelector("#redo"); if (rd) rd.onclick = redoWrong;
  app.querySelector("#home").onclick = subjectHome;
  app.querySelector("#again").onclick = () => { const p = poolOf(); startTest(db.mode === "prep" ? smartPick(p, ui.count) : shuffle(p).slice(0, ui.count), db.mode); };
  top0();
}
function redoWrong(){ startTest(shuffle(test.done.counted.filter(x => x.pick !== x.q.a).map(x => x.q)), test.mode); }
function review(){
  const bad = test.done.counted.filter(x => x.pick !== x.q.a);
  app.innerHTML = `
    <header class="hero"><span class="eyebrow">Работа над ошибками</span><h1>${bad.length} ${plural(bad.length, "ошибка","ошибки","ошибок")}</h1>
      <p>Прочитайте правильный ответ вслух. Потом решите эти вопросы ещё раз.</p></header>
    ${bad.map(x => `
      <article class="sheet err">
        <div class="err-head"><span class="tag">№ ${x.q.id} · ${esc(x.q.t)}</span><span class="mark">ошибка</span></div>
        <p class="qtext">${esc(x.q.q)}</p>
        <div class="ans">
          <div class="yours"><small>Ваш ответ</small>${x.pick === null ? "<i>нет ответа</i>" : `<s>${esc(x.q.o[x.pick])}</s>`}</div>
          <div class="right"><small>Правильно</small>${esc(x.q.o[x.q.a])}</div>
        </div>
        ${x.q.n ? `<p class="note">${esc(x.q.n)}</p>` : ""}
      </article>`).join("")}
    <button class="btn btn-red btn-wide" id="redo">Решить эти ${bad.length} заново</button>
    <div class="qnav"><button class="btn btn-line" id="back">К результату</button><button class="btn btn-line" id="home">К предмету</button></div>`;
  app.querySelector("#redo").onclick = redoWrong;
  app.querySelector("#back").onclick = results;
  app.querySelector("#home").onclick = subjectHome;
  top0();
}

/* ---------- 4. учить: вопрос → ответ ---------- */
function studyView(){
  const wrongN = SUB.qs.filter(isWrong).length;
  const memos = SUB.sets.map(s => s.memo).filter(Boolean);
  app.innerHTML = `
    <div class="qbar">
      <div class="row between"><button class="btn btn-line back" id="home">← ${esc(SUB.name)}</button><span class="eyebrow">Вопрос → ответ</span></div>
      <input class="search" id="s" type="search" placeholder="Поиск по словам" value="${esc(study.q)}" autocomplete="off">
      <div class="chips-scroll">
        <button class="chip" data-t="all" aria-pressed="${study.topic==="all" && !study.onlyWrong}">Все</button>
        ${wrongN ? `<button class="chip" data-w="1" aria-pressed="${study.onlyWrong}" style="color:var(--red)">Мои ошибки · ${wrongN}</button>` : ""}
        ${topicsOf(SUB.qs).map(t => `<button class="chip" data-t="${esc(t)}" aria-pressed="${study.topic===t && !study.onlyWrong}">${esc(t)}</button>`).join("")}
      </div>
      <label class="switch"><input type="checkbox" id="hide" ${study.hide?"checked":""}> Скрыть ответы (проверить себя)</label>
    </div>
    ${memos.map(m => `<section class="sheet memo"><span class="eyebrow">Запомнить сначала</span>${m}</section>`).join("")}
    <div id="cards" style="display:flex;flex-direction:column;gap:12px"></div>`;
  const s = app.querySelector("#s");
  s.oninput = () => { study.q = s.value; cards(); };
  app.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { study.topic = b.dataset.t; study.onlyWrong = false; studyView(); });
  const w = app.querySelector("[data-w]"); if (w) w.onclick = () => { study.onlyWrong = !study.onlyWrong; study.topic = "all"; studyView(); };
  app.querySelector("#hide").onchange = e => { study.hide = e.target.checked; study.open = new Set(); cards(); };
  app.querySelector("#home").onclick = subjectHome;
  cards(); top0();
}
function cards(){
  const qq = study.q.trim().toLowerCase();
  let list = SUB.qs;
  if (study.onlyWrong) list = list.filter(isWrong);
  else if (study.topic !== "all") list = list.filter(q => q.t === study.topic);
  if (qq) list = list.filter(q => (q.q + " " + q.o[q.a]).toLowerCase().includes(qq));
  const box = app.querySelector("#cards");
  if (!list.length) { box.innerHTML = `<p class="empty">Ничего не найдено.</p>`; return; }
  box.innerHTML = list.map(q => {
    const shown = !study.hide || study.open.has(q.key);
    const s = st(q.key);
    return `<article class="sheet card">
      <span class="tag">№ ${q.id} · ${esc(q.t)}${s.s ? ` · ${s.r}✓ ${s.w}✗` : ""}</span>
      <p class="qtext" style="font-size:17px">${esc(q.q)}</p>
      ${shown ? `<div class="ansbox">${q.tf ? (q.a === 0 ? "✓ Верно" : "✗ Неверно") : esc(q.o[q.a])}</div>${q.n ? `<p class="note">${esc(q.n)}</p>` : ""}`
              : `<button class="ansbox hidden-ans" data-open="${esc(q.key)}">Показать ответ</button>`}
    </article>`;
  }).join("");
  box.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { study.open.add(b.dataset.open); cards(); });
}

if (SUBJ.length) subjects(); else app.innerHTML = '<p class="empty">Тесты не найдены.</p>';
</script>

</body>
</html>
